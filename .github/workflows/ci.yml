name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: mkdir -p "${{ runner.temp }}/career-agent-data"
      - name: Backend regression tests
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          MULTI_TENANT_ENABLED: "false"
          DATA_PATH: ${{ runner.temp }}/career-agent-data
          DATABASE_URL: sqlite:///${{ runner.temp }}/career-agent-data/ci.db
        run: pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --prefix frontend
      - run: python -m pip install -r backend/requirements.txt
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - name: Install Chromium for E2E
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend for E2E
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          MULTI_TENANT_ENABLED: "false"
          DATA_PATH: ${{ runner.temp }}/career-agent-data-e2e
          DATABASE_URL: sqlite:///${{ runner.temp }}/career-agent-data-e2e/ci.db
        run: |
          mkdir -p "${DATA_PATH}"
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > "${RUNNER_TEMP}/career-agent-e2e-backend.log" 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:8000/api/system/health && break || sleep 1; done
      - name: Run critical browser flows
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm --prefix frontend run e2e
