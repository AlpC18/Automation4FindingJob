<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Career Agent Copilot</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 14px;
      background: #0b101a;
      color: #f8fafc;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      margin-bottom: 12px;
      font-family: monospace;
    }
    .card {
      background: #131c2e;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .msg {
      font-size: 11px;
      color: #38bdf8;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h2>🚀 Career Agent Copilot</h2>
  <div class="status-badge" id="engineStatus">Backend kontrol ediliyor…</div>

  <div class="card">
    <label for="apiBaseUrl" style="display:block;font-size:10px;color:#cbd5e1;margin-bottom:4px;">Backend API adresi</label>
    <input id="apiBaseUrl" type="url" autocomplete="url" spellcheck="false" style="width:100%;box-sizing:border-box;background:#0b101a;color:#f8fafc;border:1px solid #334155;border-radius:6px;padding:7px;font-size:10px;">
    <label for="dashboardUrl" style="display:block;font-size:10px;color:#cbd5e1;margin:8px 0 4px;">Kariyer paneli adresi</label>
    <input id="dashboardUrl" type="url" autocomplete="url" spellcheck="false" style="width:100%;box-sizing:border-box;background:#0b101a;color:#f8fafc;border:1px solid #334155;border-radius:6px;padding:7px;font-size:10px;">
    <button class="btn btn-secondary" id="saveConfigBtn">Adresleri kaydet</button>
  </div>

  <div class="card">
    <div style="font-size: 11px; color: #94a3b8; font-weight: 600; margin-bottom: 4px;">CANLI SAYFA KONTROLÜ</div>
    <div style="font-size: 11px; color: #e2e8f0;" id="activeUrl">Sekme kontrol ediliyor...</div>
    <button class="btn" id="injectCopilotBtn">Sayfada Copilot'u Aç</button>
  </div>

  <div class="card" style="border-color: #0284c7; background: #0c1c38;">
    <div style="font-size: 11px; color: #38bdf8; font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center;">
      <span>LINKEDIN HANDSHAKE</span>
      <span id="sessionStatusBadge" style="font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #1e293b; color: #94a3b8;">Kontrol ediliyor</span>
    </div>
    <div style="font-size: 10px; color: #94a3b8; margin-bottom: 6px; line-height: 1.4;">
      Playwright'ın 2FA sormadan profilinizle başvurması için aktif oturum çerezlerini (li_at) backend'e aktarır.
    </div>
    <button class="btn" id="syncSessionBtn" style="background: #0284c7;">🤝 Oturumu Senkronize Et</button>
  </div>

  <div class="card">
    <div style="font-size: 11px; color: #94a3b8; font-weight: 600; margin-bottom: 4px;">HIZLI ERİŞİM</div>
    <button class="btn btn-secondary" id="openDashboardBtn">Kariyer Panelini Aç (Web)</button>
    <button class="btn btn-secondary" id="openTelegramBtn">Telegram Bildirimlerini Aç</button>
  </div>

  <div class="msg" id="feedback"></div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
