version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: otonom-career-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - backend_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_started
    networks:
      - career-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: otonom-career-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      RUNTIME_API_AUTH_TOKEN: ${PUBLIC_API_AUTH_TOKEN:-}
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - career-network

  redis:
    image: redis:7-alpine
    container_name: otonom-career-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - career-network

volumes:
  backend_data:
    driver: local
  redis_data:
    driver: local

networks:
  career-network:
    driver: bridge
